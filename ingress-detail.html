<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - Ingress 详情</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .detail-header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }
        .detail-icon {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }
        .detail-icon svg {
            width: 32px;
            height: 32px;
        }
        .detail-info h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--ks-text);
        }
        .detail-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .detail-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--ks-text-secondary);
        }
        .detail-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .detail-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--ks-border);
            margin-bottom: 20px;
        }
        .detail-tab {
            padding: 12px 20px;
            font-size: 14px;
            color: var(--ks-text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .detail-tab:hover {
            color: var(--ks-primary);
        }
        .detail-tab.active {
            color: var(--ks-primary);
            border-bottom-color: var(--ks-primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .info-section {
            margin-bottom: 24px;
        }
        .info-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ks-text);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--ks-border);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-label {
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        .info-value {
            font-size: 14px;
            color: var(--ks-text);
            font-weight: 500;
        }
        .rule-card {
            background: var(--ks-bg-dark);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .rule-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.1), rgba(142, 68, 173, 0.05));
            border-bottom: 1px solid var(--ks-border);
        }
        .rule-host {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rule-host-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(155, 89, 182, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9b59b6;
        }
        .rule-host-text {
            font-weight: 600;
            color: var(--ks-text);
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .rule-tls {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(85, 188, 138, 0.1);
            border-radius: 4px;
            font-size: 12px;
            color: var(--ks-success);
        }
        .rule-paths {
            padding: 0;
        }
        .path-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--ks-border);
        }
        .path-item:last-child {
            border-bottom: none;
        }
        .path-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .path-text {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: var(--ks-text);
            padding: 4px 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        .path-type {
            font-size: 11px;
            color: var(--ks-text-secondary);
            padding: 2px 8px;
            background: var(--ks-border);
            border-radius: 4px;
        }
        .path-arrow {
            color: var(--ks-text-secondary);
            margin: 0 16px;
        }
        .path-backend {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .backend-service {
            color: var(--ks-primary);
            font-weight: 500;
            cursor: pointer;
        }
        .backend-service:hover {
            text-decoration: underline;
        }
        .backend-port {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            color: var(--ks-text-secondary);
            padding: 2px 8px;
            background: rgba(50, 157, 206, 0.1);
            border-radius: 4px;
        }
        .access-urls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .access-url-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(85, 188, 138, 0.1), rgba(50, 157, 206, 0.1));
            border-radius: 8px;
        }
        .access-url-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ks-success);
        }
        .access-url-info {
            flex: 1;
        }
        .access-url-label {
            font-size: 11px;
            color: var(--ks-text-secondary);
            margin-bottom: 4px;
        }
        .access-url-link {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            color: var(--ks-primary);
            text-decoration: none;
        }
        .access-url-link:hover {
            text-decoration: underline;
        }
        .copy-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: white;
            border: 1px solid var(--ks-border);
            border-radius: 4px;
            cursor: pointer;
            color: var(--ks-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .copy-btn:hover {
            background: var(--ks-bg-dark);
            border-color: var(--ks-primary);
            color: var(--ks-primary);
        }
        .tls-section {
            background: var(--ks-bg-dark);
            border-radius: 8px;
            padding: 20px;
        }
        .tls-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--ks-border);
        }
        .tls-item:last-child {
            border-bottom: none;
        }
        .tls-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(85, 188, 138, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ks-success);
        }
        .tls-info {
            flex: 1;
        }
        .tls-secret {
            font-weight: 500;
            color: var(--ks-text);
        }
        .tls-hosts {
            font-size: 12px;
            color: var(--ks-text-secondary);
            margin-top: 4px;
        }
        .selector-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .selector-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(155, 89, 182, 0.1);
            border: 1px solid rgba(155, 89, 182, 0.2);
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .selector-key {
            color: #9b59b6;
        }
        .selector-sep {
            color: var(--ks-text-secondary);
            margin: 0 4px;
        }
        .selector-value {
            color: var(--ks-text);
        }
    </style>
</head>
<body>
    <div class="ks-layout ks-layout-with-sidebar" id="app"></div>
    <script src="shared.js"></script>
    <script>
        const ingressName = 'api-ingress';
        const namespace = 'production';

        document.getElementById('app').innerHTML = `
            ${getSidebarHTML('ingresses')}
            <main class="ks-main ks-main-with-sidebar">
                ${getHeaderHTML([
                    {text: '工作台', href: 'index.html'},
                    {text: '服务与网络', href: 'ingresses.html'},
                    {text: 'Ingresses', href: 'ingresses.html'},
                    {text: ingressName}
                ])}
                <div class="ks-content">
                    <div class="ks-card">
                        <div class="detail-header">
                            <div class="detail-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                                </svg>
                            </div>
                            <div class="detail-info">
                                <h1>${ingressName}</h1>
                                <div class="detail-meta">
                                    <div class="detail-meta-item">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                                        ${namespace}
                                    </div>
                                    <div class="detail-meta-item">
                                        <span class="ks-tag ks-tag-success">nginx</span>
                                    </div>
                                    <div class="detail-meta-item">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        创建于 2024-01-12 08:45
                                    </div>
                                </div>
                            </div>
                            <div class="detail-actions">
                                <button class="ks-btn" onclick="location.href='yaml-editor.html'">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                    查看 YAML
                                </button>
                                <button class="ks-btn ks-btn-primary">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    编辑
                                </button>
                                <button class="ks-btn" style="color: var(--ks-danger);">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    删除
                                </button>
                            </div>
                        </div>

                        <div class="detail-tabs">
                            <div class="detail-tab active" onclick="switchTab('rules')">路由规则</div>
                            <div class="detail-tab" onclick="switchTab('access')">访问地址</div>
                            <div class="detail-tab" onclick="switchTab('tls')">TLS 配置</div>
                            <div class="detail-tab" onclick="switchTab('metadata')">元数据</div>
                        </div>

                        <!-- 路由规则 Tab -->
                        <div id="tab-rules" class="tab-content active">
                            <div class="rule-card">
                                <div class="rule-header">
                                    <div class="rule-host">
                                        <div class="rule-host-icon">
                                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                        </div>
                                        <span class="rule-host-text">api.example.com</span>
                                    </div>
                                    <div class="rule-tls">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                        TLS 已启用
                                    </div>
                                </div>
                                <div class="rule-paths">
                                    <div class="path-item">
                                        <div class="path-info">
                                            <span class="path-text">/api</span>
                                            <span class="path-type">Prefix</span>
                                        </div>
                                        <span class="path-arrow">→</span>
                                        <div class="path-backend">
                                            <span class="backend-service" onclick="location.href='service-detail.html'">api-gateway</span>
                                            <span class="backend-port">:8080</span>
                                        </div>
                                    </div>
                                    <div class="path-item">
                                        <div class="path-info">
                                            <span class="path-text">/auth</span>
                                            <span class="path-type">Prefix</span>
                                        </div>
                                        <span class="path-arrow">→</span>
                                        <div class="path-backend">
                                            <span class="backend-service" onclick="location.href='service-detail.html'">auth-service</span>
                                            <span class="backend-port">:8080</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="rule-card">
                                <div class="rule-header">
                                    <div class="rule-host">
                                        <div class="rule-host-icon">
                                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                        </div>
                                        <span class="rule-host-text">www.example.com</span>
                                    </div>
                                    <div class="rule-tls">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                        TLS 已启用
                                    </div>
                                </div>
                                <div class="rule-paths">
                                    <div class="path-item">
                                        <div class="path-info">
                                            <span class="path-text">/</span>
                                            <span class="path-type">Prefix</span>
                                        </div>
                                        <span class="path-arrow">→</span>
                                        <div class="path-backend">
                                            <span class="backend-service" onclick="location.href='service-detail.html'">frontend</span>
                                            <span class="backend-port">:80</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 访问地址 Tab -->
                        <div id="tab-access" class="tab-content">
                            <div class="info-section">
                                <div class="info-section-title">外部访问地址</div>
                                <div class="access-urls">
                                    <div class="access-url-item">
                                        <div class="access-url-icon">
                                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                        </div>
                                        <div class="access-url-info">
                                            <div class="access-url-label">HTTPS (推荐)</div>
                                            <a href="https://api.example.com/api" class="access-url-link" target="_blank">https://api.example.com/api</a>
                                        </div>
                                        <button class="copy-btn">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                            复制
                                        </button>
                                    </div>
                                    <div class="access-url-item">
                                        <div class="access-url-icon">
                                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                        </div>
                                        <div class="access-url-info">
                                            <div class="access-url-label">HTTPS (推荐)</div>
                                            <a href="https://www.example.com" class="access-url-link" target="_blank">https://www.example.com</a>
                                        </div>
                                        <button class="copy-btn">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                            复制
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="info-section">
                                <div class="info-section-title">负载均衡器信息</div>
                                <div class="info-grid">
                                    <div class="info-item">
                                        <span class="info-label">外部 IP</span>
                                        <span class="info-value" style="font-family: monospace;">203.0.113.50</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Ingress Class</span>
                                        <span class="info-value">nginx</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- TLS Tab -->
                        <div id="tab-tls" class="tab-content">
                            <div class="info-section">
                                <div class="info-section-title">TLS 证书配置</div>
                                <div class="tls-section">
                                    <div class="tls-item">
                                        <div class="tls-icon">
                                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                        </div>
                                        <div class="tls-info">
                                            <div class="tls-secret">api-tls-secret</div>
                                            <div class="tls-hosts">主机: api.example.com, www.example.com</div>
                                        </div>
                                        <button class="ks-btn" style="font-size: 12px;">查看 Secret</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 元数据 Tab -->
                        <div id="tab-metadata" class="tab-content">
                            <div class="info-section">
                                <div class="info-section-title">标签</div>
                                <div class="selector-list">
                                    <span class="selector-tag">
                                        <span class="selector-key">app</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">api-ingress</span>
                                    </span>
                                    <span class="selector-tag">
                                        <span class="selector-key">environment</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">production</span>
                                    </span>
                                </div>
                            </div>
                            <div class="info-section">
                                <div class="info-section-title">注解</div>
                                <div class="selector-list">
                                    <span class="selector-tag">
                                        <span class="selector-key">kubernetes.io/ingress.class</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">nginx</span>
                                    </span>
                                    <span class="selector-tag">
                                        <span class="selector-key">nginx.ingress.kubernetes.io/ssl-redirect</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">true</span>
                                    </span>
                                    <span class="selector-tag">
                                        <span class="selector-key">cert-manager.io/cluster-issuer</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">letsencrypt-prod</span>
                                    </span>
                                </div>
                            </div>
                            <div class="info-section">
                                <div class="info-section-title">其他信息</div>
                                <div class="info-grid">
                                    <div class="info-item">
                                        <span class="info-label">UID</span>
                                        <span class="info-value" style="font-family: monospace; font-size: 12px;">ingr-1234-5678-90ab-cdef12345678</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Resource Version</span>
                                        <span class="info-value" style="font-family: monospace;">98765432</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">创建时间</span>
                                        <span class="info-value">2024-01-12 08:45:30</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        `;

        function switchTab(tabName) {
            document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
