<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - 节点详情</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
        .detail-title { display: flex; align-items: center; gap: 16px; }
        .detail-icon { width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg, #329dce, #55bc8a); display: flex; align-items: center; justify-content: center; color: #fff; }
        .detail-icon svg { width: 24px; height: 24px; }
        .detail-name { font-size: 20px; font-weight: 600; }
        .detail-meta { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .detail-actions { display: flex; gap: 12px; }
        .detail-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .detail-tab { padding: 12px 20px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
        .detail-tab:hover { color: var(--ks-primary); }
        .detail-tab.active { color: var(--ks-primary); border-bottom-color: var(--ks-primary); font-weight: 500; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: var(--content-bg); border-radius: 8px; padding: 20px; }
        .stat-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        .stat-bar { height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; }
        .stat-fill { height: 100%; border-radius: 4px; }
        .stat-fill.cpu { background: var(--ks-primary); }
        .stat-fill.memory { background: var(--ks-success); }
        .stat-fill.pods { background: var(--ks-warning); }
        .stat-fill.disk { background: #9b59b6; }
        .stat-detail { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
        .info-section { margin-bottom: 24px; }
        .section-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-size: 12px; color: var(--text-secondary); }
        .info-value { font-size: 14px; color: var(--text-primary); }
        .conditions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .condition-card { background: var(--content-bg); border-radius: 8px; padding: 16px; display: flex; align-items: center; gap: 12px; }
        .condition-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .condition-icon.ok { background: rgba(85, 188, 138, 0.1); color: var(--ks-success); }
        .condition-icon.error { background: rgba(202, 38, 33, 0.1); color: var(--ks-danger); }
        .condition-name { font-weight: 500; font-size: 13px; }
        .condition-status { font-size: 12px; color: var(--text-secondary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .taints-list { display: flex; flex-wrap: wrap; gap: 8px; }
    </style>
</head>
<body>
    <div class="ks-layout ks-layout-with-sidebar" id="app"></div>
    <script src="shared.js"></script>
    <script>
        document.getElementById('app').innerHTML = `
            ${getSidebarHTML('nodes')}
            <main class="ks-main ks-main-with-sidebar">
                ${getHeaderHTML([{text: '工作台', href: 'index.html'}, {text: '集群管理'}, {text: '节点管理', href: 'nodes.html'}, {text: 'worker-02'}])}
                <div class="ks-content">
                    <div class="ks-card" style="padding: 24px;">
                        <div class="detail-header">
                            <div class="detail-title">
                                <div class="detail-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                                </div>
                                <div>
                                    <div class="detail-name">worker-02</div>
                                    <div class="detail-meta">192.168.1.12 | Kubernetes v1.28.3</div>
                                </div>
                                <span class="ks-status ks-status-running" style="margin-left: 12px;"><span class="ks-status-dot"></span>Ready</span>
                            </div>
                            <div class="detail-actions">
                                <button class="ks-btn ks-btn-default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>终端</button>
                                <button class="ks-btn ks-btn-default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>停止调度</button>
                                <button class="ks-btn ks-btn-default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>编辑 YAML</button>
                            </div>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-label">CPU 使用率</div>
                                <div class="stat-value" style="color: var(--ks-primary);">45%</div>
                                <div class="stat-bar"><div class="stat-fill cpu" style="width: 45%;"></div></div>
                                <div class="stat-detail">1.8 核 / 4 核</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">内存使用率</div>
                                <div class="stat-value" style="color: var(--ks-success);">68%</div>
                                <div class="stat-bar"><div class="stat-fill memory" style="width: 68%;"></div></div>
                                <div class="stat-detail">5.4 GB / 8 GB</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">Pod 使用量</div>
                                <div class="stat-value" style="color: var(--ks-warning);">23/110</div>
                                <div class="stat-bar"><div class="stat-fill pods" style="width: 21%;"></div></div>
                                <div class="stat-detail">21% 已使用</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-label">磁盘使用率</div>
                                <div class="stat-value" style="color: #9b59b6;">52%</div>
                                <div class="stat-bar"><div class="stat-fill disk" style="width: 52%;"></div></div>
                                <div class="stat-detail">52 GB / 100 GB</div>
                            </div>
                        </div>

                        <div class="detail-tabs">
                            <div class="detail-tab active" onclick="switchTab('overview')">概览</div>
                            <div class="detail-tab" onclick="switchTab('pods')">运行的 Pods (23)</div>
                            <div class="detail-tab" onclick="switchTab('events')">事件</div>
                            <div class="detail-tab" onclick="switchTab('metadata')">元数据</div>
                        </div>

                        <div id="tab-overview" class="tab-content active">
                            <div class="info-section">
                                <div class="section-title">节点状态</div>
                                <div class="conditions-grid">
                                    <div class="condition-card">
                                        <div class="condition-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg></div>
                                        <div><div class="condition-name">Ready</div><div class="condition-status">节点正常运行</div></div>
                                    </div>
                                    <div class="condition-card">
                                        <div class="condition-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg></div>
                                        <div><div class="condition-name">MemoryPressure</div><div class="condition-status">内存充足</div></div>
                                    </div>
                                    <div class="condition-card">
                                        <div class="condition-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg></div>
                                        <div><div class="condition-name">DiskPressure</div><div class="condition-status">磁盘空间充足</div></div>
                                    </div>
                                    <div class="condition-card">
                                        <div class="condition-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg></div>
                                        <div><div class="condition-name">PIDPressure</div><div class="condition-status">进程数正常</div></div>
                                    </div>
                                    <div class="condition-card">
                                        <div class="condition-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg></div>
                                        <div><div class="condition-name">NetworkUnavailable</div><div class="condition-status">网络正常</div></div>
                                    </div>
                                </div>
                            </div>

                            <div class="info-section">
                                <div class="section-title">节点信息</div>
                                <div class="info-grid">
                                    <div class="info-item"><span class="info-label">主机名</span><span class="info-value">worker-02</span></div>
                                    <div class="info-item"><span class="info-label">内部 IP</span><span class="info-value">192.168.1.12</span></div>
                                    <div class="info-item"><span class="info-label">操作系统</span><span class="info-value">Ubuntu 22.04.3 LTS</span></div>
                                    <div class="info-item"><span class="info-label">内核版本</span><span class="info-value">5.15.0-89-generic</span></div>
                                    <div class="info-item"><span class="info-label">容器运行时</span><span class="info-value">containerd://1.7.2</span></div>
                                    <div class="info-item"><span class="info-label">Kubelet 版本</span><span class="info-value">v1.28.3</span></div>
                                    <div class="info-item"><span class="info-label">架构</span><span class="info-value">amd64</span></div>
                                    <div class="info-item"><span class="info-label">创建时间</span><span class="info-value">2024-01-01 00:00:00</span></div>
                                </div>
                            </div>

                            <div class="info-section">
                                <div class="section-title">资源容量</div>
                                <div class="info-grid">
                                    <div class="info-item"><span class="info-label">CPU</span><span class="info-value">4 核</span></div>
                                    <div class="info-item"><span class="info-label">内存</span><span class="info-value">8 GB</span></div>
                                    <div class="info-item"><span class="info-label">最大 Pods</span><span class="info-value">110</span></div>
                                    <div class="info-item"><span class="info-label">临时存储</span><span class="info-value">100 GB</span></div>
                                </div>
                            </div>

                            <div class="info-section">
                                <div class="section-title">污点 (Taints)</div>
                                <div class="taints-list">
                                    <span class="ks-tag ks-tag-default">无污点配置</span>
                                </div>
                            </div>
                        </div>

                        <div id="tab-pods" class="tab-content">
                            <table class="ks-table">
                                <thead><tr><th>名称</th><th>命名空间</th><th>状态</th><th>CPU</th><th>内存</th><th>重启</th><th>运行时间</th></tr></thead>
                                <tbody>
                                    <tr><td><a href="pod-detail.html" style="color: var(--ks-primary);">nginx-deployment-xxx</a></td><td>production</td><td><span class="ks-status ks-status-running"><span class="ks-status-dot"></span>Running</span></td><td>50m</td><td>128Mi</td><td>0</td><td>5d</td></tr>
                                    <tr><td><a href="pod-detail.html" style="color: var(--ks-primary);">api-gateway-yyy</a></td><td>production</td><td><span class="ks-status ks-status-running"><span class="ks-status-dot"></span>Running</span></td><td>100m</td><td>256Mi</td><td>0</td><td>3d</td></tr>
                                    <tr><td><a href="pod-detail.html" style="color: var(--ks-primary);">coredns-zzz</a></td><td>kube-system</td><td><span class="ks-status ks-status-running"><span class="ks-status-dot"></span>Running</span></td><td>20m</td><td>64Mi</td><td>0</td><td>14d</td></tr>
                                    <tr><td><a href="pod-detail.html" style="color: var(--ks-primary);">calico-node-abc</a></td><td>kube-system</td><td><span class="ks-status ks-status-running"><span class="ks-status-dot"></span>Running</span></td><td>80m</td><td>128Mi</td><td>0</td><td>14d</td></tr>
                                </tbody>
                            </table>
                        </div>

                        <div id="tab-events" class="tab-content">
                            <table class="ks-table">
                                <thead><tr><th>类型</th><th>原因</th><th>消息</th><th>时间</th></tr></thead>
                                <tbody>
                                    <tr><td><span class="ks-tag ks-tag-success">Normal</span></td><td>NodeReady</td><td>Node worker-02 status is now: NodeReady</td><td>14 天前</td></tr>
                                    <tr><td><span class="ks-tag ks-tag-success">Normal</span></td><td>RegisteredNode</td><td>Node worker-02 event: Registered Node worker-02 in Controller</td><td>14 天前</td></tr>
                                </tbody>
                            </table>
                        </div>

                        <div id="tab-metadata" class="tab-content">
                            <div class="section-title">标签 (Labels)</div>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;">
                                <span class="ks-tag ks-tag-primary">kubernetes.io/hostname=worker-02</span>
                                <span class="ks-tag ks-tag-primary">kubernetes.io/os=linux</span>
                                <span class="ks-tag ks-tag-primary">kubernetes.io/arch=amd64</span>
                                <span class="ks-tag ks-tag-primary">node-role.kubernetes.io/worker=</span>
                                <span class="ks-tag ks-tag-primary">node.kubernetes.io/instance-type=standard</span>
                            </div>
                            <div class="section-title">注解 (Annotations)</div>
                            <div class="info-grid">
                                <div class="info-item"><span class="info-label">kubeadm.alpha.kubernetes.io/cri-socket</span><span class="info-value">unix:///run/containerd/containerd.sock</span></div>
                                <div class="info-item"><span class="info-label">node.alpha.kubernetes.io/ttl</span><span class="info-value">0</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        `;

        function switchTab(tabName) {
            document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
