<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - Service 详情</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .detail-header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }
        .detail-icon {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--ks-primary), #2683b5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }
        .detail-icon svg {
            width: 28px;
            height: 28px;
        }
        .detail-info {
            flex: 1;
        }
        .detail-info h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--ks-text);
        }
        .detail-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .detail-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        .meta-tag {
            padding: 2px 10px;
            background: rgba(85, 188, 138, 0.1);
            color: var(--ks-success);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(85, 188, 138, 0.2);
        }
        .detail-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .detail-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--ks-border);
            margin-bottom: 24px;
        }
        .detail-tab {
            padding: 12px 24px;
            font-size: 14px;
            color: var(--ks-text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .detail-tab:hover {
            color: var(--ks-primary);
        }
        .detail-tab.active {
            color: var(--ks-primary);
            border-bottom-color: var(--ks-primary);
            font-weight: 500;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* 外部访问区块 */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ks-text);
            margin-bottom: 16px;
        }
        .access-list {
            margin-bottom: 32px;
        }
        .access-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--ks-border);
        }
        .access-item:last-child {
            border-bottom: none;
        }
        .access-icon {
            width: 20px;
            margin-right: 12px;
            color: var(--ks-primary);
        }
        .access-url {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: var(--ks-primary);
            text-decoration: none;
        }
        .access-url:hover {
            text-decoration: underline;
        }
        .access-type {
            margin-left: 16px;
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        .access-copy {
            margin-left: auto;
            font-size: 12px;
            color: var(--ks-text-secondary);
            cursor: pointer;
            padding: 4px 12px;
            border: none;
            background: none;
        }
        .access-copy:hover {
            color: var(--ks-primary);
        }
        /* 基本信息表格 */
        .info-table {
            width: 100%;
            margin-bottom: 32px;
        }
        .info-row {
            display: flex;
            border-bottom: 1px solid var(--ks-border);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-cell {
            flex: 1;
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .info-cell:not(:last-child) {
            padding-right: 32px;
        }
        .info-label {
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        .info-value {
            font-size: 13px;
            color: var(--ks-text);
            font-weight: 500;
        }
        .info-value.mono {
            font-family: 'Monaco', 'Menlo', monospace;
        }
        /* 选择器标签 */
        .selector-section {
            margin-bottom: 32px;
        }
        .selector-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .selector-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: #f4f5f7;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .selector-key {
            color: var(--ks-primary);
        }
        .selector-sep {
            color: var(--ks-text-secondary);
            margin: 0 4px;
        }
        .selector-value {
            color: var(--ks-text);
        }
        /* 端口卡片 */
        .port-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .port-card {
            background: #f9fbfd;
            border-radius: 8px;
            padding: 16px 20px;
        }
        .port-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .port-name {
            font-weight: 600;
            color: var(--ks-text);
        }
        .port-protocol {
            padding: 2px 8px;
            background: rgba(50, 157, 206, 0.1);
            color: var(--ks-primary);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .port-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .port-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .port-label {
            font-size: 11px;
            color: var(--ks-text-secondary);
        }
        .port-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--ks-text);
            font-family: 'Monaco', 'Menlo', monospace;
        }
        /* 端点列表 */
        .endpoints-section {
            margin-bottom: 24px;
        }
        .endpoint-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f9fbfd;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .endpoint-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ks-success);
        }
        .endpoint-address {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            color: var(--ks-text);
        }
        .endpoint-pod {
            font-size: 12px;
            color: var(--ks-primary);
            cursor: pointer;
            margin-left: auto;
        }
        .endpoint-pod:hover {
            text-decoration: underline;
        }
        /* Pod列表 */
        .pod-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f9fbfd;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pod-item:hover {
            background: #eff4f9;
        }
        .pod-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ks-success);
        }
        .pod-name {
            font-size: 13px;
            color: var(--ks-primary);
            font-weight: 500;
        }
        .pod-ip {
            font-size: 12px;
            color: var(--ks-text-secondary);
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .pod-node {
            margin-left: auto;
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--ks-text-secondary);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <script src="shared.js"></script>

                        <!-- 概览 Tab -->

                                    <span class="access-type">NodePort</span>

                                </div>
                                <div class="access-item">

                            </div>

                            <div class="section-title">基本信息</div>
                            <div class="info-table">
                                <div class="info-row">
                                    <div class="info-cell">
                                        <span class="info-label">名称</span>
                                        <span class="info-value">${serviceName}</span>
                                    </div>
                                    <div class="info-cell">

                                    <div class="info-cell">

                                    </div>
                                    <div class="info-cell">

                                        </div>

                                </div>
                                <div class="port-card">

                                        <span class="port-protocol">TCP</span>
                                    </div>
                                    <div class="port-info">

                                            <span class="port-value">9090</span>
                                        </div>
                                        <div class="port-item">
                                            <span class="port-label">Target Port</span>
                                            <span class="port-value">9090</span>
                                        </div>
                                        <div class="port-item">
                                            <span class="port-label">Node Port</span>
                                            <span class="port-value">30090</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 端点 Tab -->
                        <div id="tab-endpoints" class="tab-content">
                            <div class="endpoints-section">
                                <div class="section-title">Ready 端点 (3)</div>
                                <div class="endpoint-item">
                                    <div class="endpoint-status"></div>
                                    <span class="endpoint-address">10.244.1.15:8080</span>
                                    <a class="endpoint-pod" href="pod-detail.html">api-gateway-6d4f5b7c8-abc12</a>
                                </div>
                                <div class="endpoint-item">
                                    <div class="endpoint-status"></div>
                                    <span class="endpoint-address">10.244.2.23:8080</span>
                                    <a class="endpoint-pod" href="pod-detail.html">api-gateway-6d4f5b7c8-def34</a>

                        <!-- 元数据 Tab -->

                            <div class="selector-section">

                                <div class="selector-list">
                                    <span class="selector-tag">
                                        <span class="selector-key">app</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">api-gateway</span>
                                    </span>
                                    <span class="selector-tag">
                                        <span class="selector-key">component</span>

                            <div class="info-table" style="margin-top: 24px;">
                                <div class="section-title">其他信息</div>
                                <div class="info-row">
                                    <div class="info-cell">
                                        <span class="info-label">UID</span>
                                        <span class="info-value mono" style="font-size: 12px;">a1b2c3d4-e5f6-7890-abcd-ef1234567890</span>

                                        <span class="info-label">Resource Version</span>
                                        <span class="info-value mono">12345678</span>
                                    </div>
                                    <div class="info-cell"></div>
                                    <div class="info-cell"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        `;

        function switchTab(tabName) {
            document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
