<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - Pod 详情</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
        .detail-title { display: flex; align-items: center; gap: 16px; }
        .detail-icon { width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg, var(--ks-primary), var(--ks-success)); display: flex; align-items: center; justify-content: center; color: #fff; }
        .detail-icon svg { width: 24px; height: 24px; }
        .detail-name { font-size: 20px; font-weight: 600; color: var(--text-primary); }
        .detail-namespace { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .detail-actions { display: flex; gap: 12px; }
        .detail-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .detail-tab { padding: 12px 20px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .detail-tab:hover { color: var(--ks-primary); }
        .detail-tab.active { color: var(--ks-primary); border-bottom-color: var(--ks-primary); font-weight: 500; }
        .detail-section { margin-bottom: 24px; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-size: 12px; color: var(--text-secondary); }
        .info-value { font-size: 14px; color: var(--text-primary); }
        .container-card { background: var(--content-bg); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .container-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .container-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .container-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .container-actions { display: flex; gap: 8px; }
        .container-btn { padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; color: var(--text-secondary); }
        .container-btn:hover { border-color: var(--ks-primary); color: var(--ks-primary); }
        .container-btn svg { width: 14px; height: 14px; }
        .container-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-size: 13px; }
        .resource-usage { display: flex; align-items: center; gap: 12px; }
        .usage-bar { flex: 1; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; }
        .usage-fill { height: 100%; border-radius: 3px; }
        .usage-fill.cpu { background: var(--ks-primary); }
        .usage-fill.memory { background: var(--ks-success); }
        .event-list { max-height: 400px; overflow-y: auto; }
        .event-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .event-item:last-child { border-bottom: none; }
        .event-type { width: 70px; flex-shrink: 0; }
        .event-content { flex: 1; }
        .event-reason { font-weight: 500; margin-bottom: 4px; }
        .event-message { font-size: 13px; color: var(--text-secondary); }
        .event-time { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
        .conditions-table { width: 100%; }
        .conditions-table th, .conditions-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .conditions-table th { background: var(--content-bg); font-weight: 500; font-size: 13px; color: var(--text-secondary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
