<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - 编辑 YAML</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .editor-page {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            background: white;
            border-radius: 4px;
            overflow: hidden;
        }
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--ks-border);
            background: white;
        }
        .editor-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .editor-title-icon {
            width: 40px;
            height: 40px;
            background: rgba(50, 157, 206, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ks-primary);
        }
        .editor-title h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--ks-text);
            margin: 0;
        }
        .resource-type-tag {
            padding: 3px 10px;
            background: rgba(50, 157, 206, 0.1);
            color: var(--ks-primary);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(50, 157, 206, 0.2);
        }
        .resource-name {
            color: var(--ks-text-secondary);
            font-size: 14px;
        }
        .editor-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: #f9fbfd;
            border-bottom: 1px solid var(--ks-border);
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-divider {
            width: 1px;
            height: 20px;
            background: var(--ks-border);
            margin: 0 8px;
        }
        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid var(--ks-border);
            border-radius: 4px;
            background: white;
            font-size: 12px;
            color: var(--ks-text);
            cursor: pointer;
            transition: all 0.2s;
        }
        .toolbar-btn:hover {
            border-color: var(--ks-primary);
            color: var(--ks-primary);
        }
        .toolbar-btn.primary {
            background: var(--ks-primary);
            border-color: var(--ks-primary);
            color: white;
        }
        .toolbar-btn.primary:hover {
            background: #2683b5;
        }
        .toolbar-btn svg {
            width: 14px;
            height: 14px;
        }
        .format-select-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .format-label {
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        .format-select {
            padding: 6px 28px 6px 12px;
            border: 1px solid var(--ks-border);
            border-radius: 4px;
            background: white url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e") right 8px center/12px no-repeat;
            font-size: 12px;
            cursor: pointer;
            appearance: none;
        }
        .editor-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .code-editor-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
            background: #1e1e1e;
        }
        .line-numbers {
            padding: 16px 0;
            background: #252526;
            color: #858585;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.6;
            text-align: right;
            user-select: none;
            min-width: 48px;
            border-right: 1px solid #333;
        }
        .line-number {
            padding: 0 12px;
        }
        .code-content {
            flex: 1;
            padding: 16px 20px;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #d4d4d4;
            overflow: auto;
            white-space: pre;
        }
        .yaml-key { color: #9cdcfe; }
        .yaml-value { color: #ce9178; }
        .yaml-number { color: #b5cea8; }
        .yaml-string { color: #ce9178; }
        .editor-sidebar {
            width: 300px;
            background: white;
            border-left: 1px solid var(--ks-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-section {
            border-bottom: 1px solid var(--ks-border);
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ks-text);
            background: #f9fbfd;
        }
        .sidebar-header svg {
            width: 16px;
            height: 16px;
            color: var(--ks-text-secondary);
        }
        .sidebar-content {
            padding: 16px 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--ks-border);
            font-size: 13px;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: var(--ks-text-secondary);
        }
        .info-value {
            color: var(--ks-text);
            font-weight: 500;
        }
        .validation-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .validation-status.success {
            color: var(--ks-success);
        }
        .validation-status svg {
            width: 16px;
            height: 16px;
        }
        .validation-msg {
            padding: 0 20px 16px;
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        .suggestion-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--ks-border);
            font-size: 12px;
            color: var(--ks-text);
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-icon {
            flex-shrink: 0;
            margin-top: 1px;
        }
        .suggestion-icon.warning {
            color: var(--ks-warning);
        }
        .suggestion-icon.info {
            color: var(--ks-primary);
        }
    </style>
</head>
<body>
    <div class="ks-layout ks-layout-with-sidebar" id="app"></div>
    <script src="shared.js"></script>
    <script>
        document.getElementById('app').innerHTML = `
            ${getSidebarHTML('pods')}
            <main class="ks-main ks-main-with-sidebar">
                ${getHeaderHTML([
                    {text: '工作台', href: 'index.html'},
                    {text: 'Pods', href: 'pods.html'},
                    {text: 'nginx-deployment-xxx', href: 'pod-detail.html'},
                    {text: '编辑 YAML'}
                ])}
                <div class="ks-content" style="padding: 20px;">
                    <div class="editor-page">
                        <div class="editor-header">
                            <div class="editor-title">
                                <div class="editor-title-icon">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                </div>
                                <h2>编辑 YAML</h2>
                                <span class="resource-type-tag">Pod</span>
                                <span class="resource-name">nginx-deployment-7fb96c846b-x2j5k</span>
                            </div>
                            <div class="editor-header-actions">
                                <button class="ks-btn" onclick="history.back()">取消</button>
                                <button class="ks-btn ks-btn-primary">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                                    保存
                                </button>
                            </div>
                        </div>

                        <div class="editor-toolbar">
                            <div class="toolbar-group">
                                <button class="toolbar-btn primary">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    编辑
                                </button>
                                <button class="toolbar-btn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 14v5h-5"/><path d="M3 14v5h5"/></svg>
                                    对比变更
                                </button>
                                <div class="toolbar-divider"></div>
                                <button class="toolbar-btn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                    重新加载
                                </button>
                                <button class="toolbar-btn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                    复制
                                </button>
                            </div>
                            <div class="format-select-wrapper">
                                <span class="format-label">格式:</span>
                                <select class="format-select">
                                    <option value="yaml" selected>YAML</option>
                                    <option value="json">JSON</option>
                                </select>
                            </div>
                        </div>

                        <div class="editor-main">
                            <div class="code-editor-wrapper">
                                <div class="line-numbers">${Array.from({length: 40}, (_, i) => `<div class="line-number">${i + 1}</div>`).join('')}</div>
                                <div class="code-content"><span class="yaml-key">apiVersion</span>: <span class="yaml-value">v1</span>
<span class="yaml-key">kind</span>: <span class="yaml-value">Pod</span>
<span class="yaml-key">metadata</span>:
  <span class="yaml-key">name</span>: <span class="yaml-value">nginx-deployment-7fb96c846b-x2j5k</span>
  <span class="yaml-key">namespace</span>: <span class="yaml-value">production</span>
  <span class="yaml-key">labels</span>:
    <span class="yaml-key">app</span>: <span class="yaml-value">nginx</span>
    <span class="yaml-key">pod-template-hash</span>: <span class="yaml-value">7fb96c846b</span>
    <span class="yaml-key">version</span>: <span class="yaml-value">v1.21</span>
  <span class="yaml-key">annotations</span>:
    <span class="yaml-key">prometheus.io/scrape</span>: <span class="yaml-value">"true"</span>
    <span class="yaml-key">prometheus.io/port</span>: <span class="yaml-value">"9090"</span>
<span class="yaml-key">spec</span>:
  <span class="yaml-key">containers</span>:
  - <span class="yaml-key">name</span>: <span class="yaml-value">nginx</span>
    <span class="yaml-key">image</span>: <span class="yaml-value">nginx:1.21-alpine</span>
    <span class="yaml-key">ports</span>:
    - <span class="yaml-key">containerPort</span>: <span class="yaml-number">80</span>
      <span class="yaml-key">protocol</span>: <span class="yaml-value">TCP</span>
    - <span class="yaml-key">containerPort</span>: <span class="yaml-number">443</span>
      <span class="yaml-key">protocol</span>: <span class="yaml-value">TCP</span>
    <span class="yaml-key">resources</span>:
      <span class="yaml-key">requests</span>:
        <span class="yaml-key">cpu</span>: <span class="yaml-value">100m</span>
        <span class="yaml-key">memory</span>: <span class="yaml-value">128Mi</span>
      <span class="yaml-key">limits</span>:
        <span class="yaml-key">cpu</span>: <span class="yaml-value">200m</span>
        <span class="yaml-key">memory</span>: <span class="yaml-value">256Mi</span>
    <span class="yaml-key">livenessProbe</span>:
      <span class="yaml-key">httpGet</span>:
        <span class="yaml-key">path</span>: <span class="yaml-value">/health</span>
        <span class="yaml-key">port</span>: <span class="yaml-number">80</span>
      <span class="yaml-key">initialDelaySeconds</span>: <span class="yaml-number">10</span>
      <span class="yaml-key">periodSeconds</span>: <span class="yaml-number">10</span>
    <span class="yaml-key">readinessProbe</span>:
      <span class="yaml-key">httpGet</span>:
        <span class="yaml-key">path</span>: <span class="yaml-value">/health</span>
        <span class="yaml-key">port</span>: <span class="yaml-number">80</span>
      <span class="yaml-key">initialDelaySeconds</span>: <span class="yaml-number">5</span>
      <span class="yaml-key">periodSeconds</span>: <span class="yaml-number">5</span></div>
                            </div>
                            <div class="editor-sidebar">
                                <div class="sidebar-section">
                                    <div class="sidebar-header">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                        资源信息
                                    </div>
                                    <div class="sidebar-content">
                                        <div class="info-row">
                                            <span class="info-label">类型</span>
                                            <span class="info-value">Pod</span>
                                        </div>
                                        <div class="info-row">
                                            <span class="info-label">API 版本</span>
                                            <span class="info-value">v1</span>
                                        </div>
                                        <div class="info-row">
                                            <span class="info-label">名称</span>
                                            <span class="info-value">nginx-deployment-xxx</span>
                                        </div>
                                        <div class="info-row">
                                            <span class="info-label">命名空间</span>
                                            <span class="info-value">production</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="sidebar-section">
                                    <div class="validation-status success">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                        YAML 验证通过
                                    </div>
                                    <div class="validation-msg">语法正确，无错误</div>
                                </div>
                                <div class="sidebar-section" style="flex: 1;">
                                    <div class="sidebar-header">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                        建议
                                    </div>
                                    <div class="sidebar-content">
                                        <div class="suggestion-item">
                                            <svg class="suggestion-icon warning" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                            <span>建议添加 securityContext 配置</span>
                                        </div>
                                        <div class="suggestion-item">
                                            <svg class="suggestion-icon info" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                            <span>可以考虑添加 podDisruptionBudget</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        `;
    </script>
</body>
</html>
