<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - YAML 编辑器</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
        .editor-title { display: flex; align-items: center; gap: 12px; }
        .editor-title svg { width: 20px; height: 20px; color: var(--ks-primary); }
        .editor-title h3 { font-size: 16px; font-weight: 600; }
        .resource-badge { padding: 4px 8px; background: rgba(50, 157, 206, 0.1); color: var(--ks-primary); border-radius: 4px; font-size: 12px; font-weight: 500; }
        .editor-actions { display: flex; gap: 12px; }
        .editor-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #252526; border-bottom: 1px solid #333; }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; }
        .toolbar-btn { padding: 6px 10px; border: 1px solid #444; border-radius: 4px; background: #2d2d2d; color: #ccc; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .toolbar-btn:hover { background: #3d3d3d; }
        .toolbar-btn svg { width: 14px; height: 14px; }
        .toolbar-btn.active { background: var(--ks-primary); border-color: var(--ks-primary); color: #fff; }
        .format-select { padding: 5px 10px; border: 1px solid #444; border-radius: 4px; background: #2d2d2d; color: #ccc; font-size: 12px; }
        .editor-container { display: flex; min-height: calc(100vh - 240px); }
        .code-editor { flex: 1; background: #1e1e1e; overflow: auto; }
        .line-numbers { padding: 16px 12px; background: #252526; color: #858585; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; line-height: 1.6; text-align: right; user-select: none; border-right: 1px solid #333; min-width: 50px; }
        .code-content { flex: 1; padding: 16px; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; line-height: 1.6; color: #d4d4d4; white-space: pre; overflow-x: auto; }
        .yaml-key { color: #9cdcfe; }
        .yaml-value { color: #ce9178; }
        .yaml-number { color: #b5cea8; }
        .yaml-bool { color: #569cd6; }
        .yaml-null { color: #569cd6; }
        .yaml-comment { color: #6a9955; }
        .yaml-string { color: #ce9178; }
        .yaml-anchor { color: #c586c0; }
        .editor-sidebar { width: 280px; background: var(--card-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 16px; }
        .resource-info { margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-secondary); }
        .info-value { color: var(--text-primary); font-weight: 500; }
        .validation-section { margin-top: 20px; }
        .validation-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 600; font-size: 13px; }
        .validation-ok { color: var(--ks-success); }
        .validation-error { color: var(--ks-danger); }
        .validation-list { font-size: 12px; }
        .validation-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border-color); }
        .validation-item:last-child { border-bottom: none; }
        .validation-icon { flex-shrink: 0; margin-top: 2px; }
        .editor-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border-color); background: var(--card-bg); }
        .footer-info { font-size: 12px; color: var(--text-secondary); display: flex; gap: 16px; }
        .diff-view { display: none; }
        .diff-view.active { display: flex; }
        .diff-pane { flex: 1; background: #1e1e1e; }
        .diff-header { padding: 8px 16px; background: #252526; color: #888; font-size: 12px; border-bottom: 1px solid #333; }
        .diff-added { background: rgba(85, 188, 138, 0.15); }
        .diff-removed { background: rgba(202, 38, 33, 0.15); }
    </style>
</head>
<body>
    <div class="ks-layout ks-layout-with-sidebar" id="app"></div>
    <script src="shared.js"></script>
    <script>
        document.getElementById('app').innerHTML = `
            ${getSidebarHTML('pods')}
            <main class="ks-main ks-main-with-sidebar">
                ${getHeaderHTML([{text: '工作台', href: 'index.html'}, {text: 'Pods', href: 'pods.html'}, {text: 'nginx-deployment-xxx', href: 'pod-detail.html'}, {text: '编辑 YAML'}])}
                <div class="ks-content">
                    <div class="ks-card" style="overflow: hidden; padding: 0;">
                        <div class="editor-header">
                            <div class="editor-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                <h3>编辑 YAML</h3>
                                <span class="resource-badge">Pod</span>
                                <span style="color: var(--text-secondary); font-size: 14px;">nginx-deployment-7fb96c846b-x2j5k</span>
                            </div>
                            <div class="editor-actions">
                                <button class="ks-btn ks-btn-default" onclick="history.back()">取消</button>
                                <button class="ks-btn ks-btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>保存</button>
                            </div>
                        </div>

                        <div class="editor-toolbar">
                            <div class="toolbar-left">
                                <button class="toolbar-btn active" id="editBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>编辑</button>
                                <button class="toolbar-btn" id="diffBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/></svg>对比变更</button>
                                <div style="width: 1px; height: 20px; background: #444; margin: 0 8px;"></div>
                                <button class="toolbar-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>重新加载</button>
                                <button class="toolbar-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>
                            </div>
                            <div class="toolbar-right">
                                <span style="color: #888; font-size: 12px;">格式:</span>
                                <select class="format-select">
                                    <option value="yaml" selected>YAML</option>
                                    <option value="json">JSON</option>
                                </select>
                            </div>
                        </div>

                        <div class="editor-container" id="editorView">
                            <div class="code-editor" style="display: flex;">
                                <div class="line-numbers">1

                                <div class="code-content"><span class="yaml-key">apiVersion</span>: <span class="yaml-value">v1</span>
<span class="yaml-key">kind</span>: <span class="yaml-value">Pod</span>
<span class="yaml-key">metadata</span>:
  <span class="yaml-key">name</span>: <span class="yaml-value">nginx-deployment-7fb96c846b-x2j5k</span>
  <span class="yaml-key">namespace</span>: <span class="yaml-value">production</span>
  <span class="yaml-key">labels</span>:
    <span class="yaml-key">app</span>: <span class="yaml-value">nginx</span>
    <span class="yaml-key">pod-template-hash</span>: <span class="yaml-value">7fb96c846b</span>
    <span class="yaml-key">version</span>: <span class="yaml-value">v1.21</span>
  <span class="yaml-key">annotations</span>:
    <span class="yaml-key">prometheus.io/scrape</span>: <span class="yaml-value">"true"</span>
    <span class="yaml-key">prometheus.io/port</span>: <span class="yaml-value">"9090"</span>
<span class="yaml-key">spec</span>:
  <span class="yaml-key">containers</span>:
  - <span class="yaml-key">name</span>: <span class="yaml-value">nginx</span>
    <span class="yaml-key">image</span>: <span class="yaml-value">nginx:1.21-alpine</span>
    <span class="yaml-key">ports</span>:
    - <span class="yaml-key">containerPort</span>: <span class="yaml-number">80</span>
      <span class="yaml-key">protocol</span>: <span class="yaml-value">TCP</span>
    - <span class="yaml-key">containerPort</span>: <span class="yaml-number">443</span>
      <span class="yaml-key">protocol</span>: <span class="yaml-value">TCP</span>
    <span class="yaml-key">resources</span>:
      <span class="yaml-key">requests</span>:
        <span class="yaml-key">cpu</span>: <span class="yaml-value">100m</span>
        <span class="yaml-key">memory</span>: <span class="yaml-value">128Mi</span>
      <span class="yaml-key">limits</span>:
        <span class="yaml-key">cpu</span>: <span class="yaml-value">200m</span>
        <span class="yaml-key">memory</span>: <span class="yaml-value">256Mi</span>
    <span class="yaml-key">livenessProbe</span>:
      <span class="yaml-key">httpGet</span>:
        <span class="yaml-key">path</span>: <span class="yaml-value">/health</span>
        <span class="yaml-key">port</span>: <span class="yaml-number">80</span>
      <span class="yaml-key">initialDelaySeconds</span>: <span class="yaml-number">10</span>
      <span class="yaml-key">periodSeconds</span>: <span class="yaml-number">10</span>
    <span class="yaml-key">readinessProbe</span>:
      <span class="yaml-key">httpGet</span>:
        <span class="yaml-key">path</span>: <span class="yaml-value">/health</span>
        <span class="yaml-key">port</span>: <span class="yaml-number">80</span>
      <span class="yaml-key">initialDelaySeconds</span>: <span class="yaml-number">5</span>
      <span class="yaml-key">periodSeconds</span>: <span class="yaml-number">5</span></div>
                            </div>
                            <div class="editor-sidebar">
                                <div class="sidebar-header">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                    资源信息
                                </div>
                                <div class="sidebar-content">
                                    <div class="resource-info">
                                        <div class="info-row"><span class="info-label">类型</span><span class="info-value">Pod</span></div>
                                        <div class="info-row"><span class="info-label">API 版本</span><span class="info-value">v1</span></div>
                                        <div class="info-row"><span class="info-label">名称</span><span class="info-value">nginx-deployment-xxx</span></div>
                                        <div class="info-row"><span class="info-label">命名空间</span><span class="info-value">production</span></div>
                                    </div>

                                    <div class="validation-section">
                                        <div class="validation-header validation-ok">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                            YAML 验证通过
                                        </div>
                                        <div class="validation-list" style="color: var(--text-secondary);">
                                            语法正确，无错误
                                        </div>
                                    </div>

                                    <div class="validation-section" style="margin-top: 24px;">
                                        <div class="validation-header">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                            建议
                                        </div>
                                        <div class="validation-list">
                                            <div class="validation-item">
                                                <svg class="validation-icon" viewBox="0 0 24 24" fill="none" stroke="var(--ks-warning)" stroke-width="2" width="14" height="14"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                                <span>建议添加 securityContext 配置</span>
                                            </div>
                                            <div class="validation-item">
                                                <svg class="validation-icon" viewBox="0 0 24 24" fill="none" stroke="var(--ks-primary)" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                                <span>可以考虑添加 podDisruptionBudget</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="editor-footer">
                            <div class="footer-info">
                                <span>行 1, 列 1</span>
                                <span>40 行</span>
                                <span>UTF-8</span>
                                <span>YAML</span>
                            </div>
                            <div style="font-size: 12px; color: var(--text-secondary);">
                                <kbd style="background: var(--content-bg); padding: 2px 6px; border-radius: 3px;">Ctrl</kbd> + <kbd style="background: var(--content-bg); padding: 2px 6px; border-radius: 3px;">S</kbd> 保存
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        `;
    </script>
</body>
</html>
