<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - Secret 详情</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .detail-header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }
        .detail-icon {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            background: linear-gradient(135deg, #f5a623, #d4920f);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }
        .detail-icon svg {
            width: 32px;
            height: 32px;
        }
        .detail-info h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--ks-text);
        }
        .detail-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .detail-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--ks-text-secondary);
        }
        .detail-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }
        .detail-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--ks-border);
            margin-bottom: 20px;
        }
        .detail-tab {
            padding: 12px 20px;
            font-size: 14px;
            color: var(--ks-text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .detail-tab:hover {
            color: var(--ks-primary);
        }
        .detail-tab.active {
            color: var(--ks-primary);
            border-bottom-color: var(--ks-primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .info-section {
            margin-bottom: 24px;
        }
        .info-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ks-text);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--ks-border);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-label {
            font-size: 12px;
            color: var(--ks-text-secondary);
        }
        .info-value {
            font-size: 14px;
            color: var(--ks-text);
            font-weight: 500;
        }
        .secret-type-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(245, 166, 35, 0.1);
            color: var(--ks-warning);
        }
        .data-item {
            background: var(--ks-bg-dark);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .data-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(245, 166, 35, 0.1);
            border-bottom: 1px solid var(--ks-border);
        }
        .data-item-key {
            font-weight: 600;
            color: var(--ks-text);
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .data-item-key svg {
            color: var(--ks-warning);
        }
        .data-item-actions {
            display: flex;
            gap: 8px;
        }
        .data-action-btn {
            padding: 4px 12px;
            font-size: 12px;
            background: white;
            border: 1px solid var(--ks-border);
            border-radius: 4px;
            cursor: pointer;
            color: var(--ks-text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .data-action-btn:hover {
            background: var(--ks-bg-dark);
            color: var(--ks-primary);
        }
        .data-item-content {
            padding: 16px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--ks-text);
        }
        .secret-value {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .secret-masked {
            letter-spacing: 2px;
            color: var(--ks-text-secondary);
        }
        .secret-revealed {
            background: rgba(245, 166, 35, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            word-break: break-all;
        }
        .reveal-btn {
            padding: 4px 12px;
            font-size: 12px;
            background: white;
            border: 1px solid var(--ks-border);
            border-radius: 4px;
            cursor: pointer;
            color: var(--ks-text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .reveal-btn:hover {
            background: var(--ks-bg-dark);
            color: var(--ks-warning);
        }
        .selector-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .selector-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(245, 166, 35, 0.1);
            border: 1px solid rgba(245, 166, 35, 0.2);
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .selector-key {
            color: var(--ks-warning);
        }
        .selector-sep {
            color: var(--ks-text-secondary);
            margin: 0 4px;
        }
        .selector-value {
            color: var(--ks-text);
        }
        .usage-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .usage-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--ks-bg-dark);
            border-radius: 6px;
        }
        .usage-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(50, 157, 206, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ks-primary);
        }
        .usage-info {
            flex: 1;
        }
        .usage-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--ks-primary);
            cursor: pointer;
        }
        .usage-name:hover {
            text-decoration: underline;
        }
        .usage-type {
            font-size: 11px;
            color: var(--ks-text-secondary);
        }
        .usage-mount {
            font-size: 12px;
            color: var(--ks-text-secondary);
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .warning-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(245, 166, 35, 0.1);
            border: 1px solid rgba(245, 166, 35, 0.3);
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--ks-warning);
        }
        .warning-banner svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="ks-layout ks-layout-with-sidebar" id="app"></div>
    <script src="shared.js"></script>
    <script>
        const secretName = 'db-credentials';
        const namespace = 'production';

        document.getElementById('app').innerHTML = `
            ${getSidebarHTML('secrets')}
            <main class="ks-main ks-main-with-sidebar">
                ${getHeaderHTML([
                    {text: '工作台', href: 'index.html'},
                    {text: '配置中心', href: 'secrets.html'},
                    {text: 'Secrets', href: 'secrets.html'},
                    {text: secretName}
                ])}
                <div class="ks-content">
                    <div class="ks-card">
                        <div class="detail-header">
                            <div class="detail-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </div>
                            <div class="detail-info">
                                <h1>${secretName}</h1>
                                <div class="detail-meta">
                                    <div class="detail-meta-item">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                                        ${namespace}
                                    </div>
                                    <div class="detail-meta-item">
                                        <span class="secret-type-badge">Opaque</span>
                                    </div>
                                    <div class="detail-meta-item">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
                                        3 个密钥
                                    </div>
                                    <div class="detail-meta-item">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        创建于 2024-01-05 11:20
                                    </div>
                                </div>
                            </div>
                            <div class="detail-actions">
                                <button class="ks-btn" onclick="location.href='yaml-editor.html'">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                    查看 YAML
                                </button>
                                <button class="ks-btn ks-btn-primary">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    编辑
                                </button>
                                <button class="ks-btn" style="color: var(--ks-danger);">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                    删除
                                </button>
                            </div>
                        </div>

                        <div class="warning-banner">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                            </svg>
                            <span>此 Secret 包含敏感数据，请谨慎操作。显示的值已经 Base64 解码。</span>
                        </div>

                        <div class="detail-tabs">
                            <div class="detail-tab active" onclick="switchTab('data')">密钥数据</div>
                            <div class="detail-tab" onclick="switchTab('usage')">使用情况</div>
                            <div class="detail-tab" onclick="switchTab('metadata')">元数据</div>
                        </div>

                        <!-- 密钥数据 Tab -->
                        <div id="tab-data" class="tab-content active">
                            <div class="data-item">
                                <div class="data-item-header">
                                    <span class="data-item-key">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                                        username
                                    </span>
                                    <div class="data-item-actions">
                                        <button class="data-action-btn" onclick="toggleReveal(this)">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            显示
                                        </button>
                                        <button class="data-action-btn">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                            复制
                                        </button>
                                    </div>
                                </div>
                                <div class="data-item-content">
                                    <div class="secret-value">
                                        <span class="secret-masked">••••••••••••</span>
                                        <span class="secret-revealed" style="display: none;">admin_user</span>
                                    </div>
                                </div>
                            </div>

                            <div class="data-item">
                                <div class="data-item-header">
                                    <span class="data-item-key">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                                        password
                                    </span>
                                    <div class="data-item-actions">
                                        <button class="data-action-btn" onclick="toggleReveal(this)">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            显示
                                        </button>
                                        <button class="data-action-btn">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                            复制
                                        </button>
                                    </div>
                                </div>
                                <div class="data-item-content">
                                    <div class="secret-value">
                                        <span class="secret-masked">••••••••••••••••</span>
                                        <span class="secret-revealed" style="display: none;">super_secure_password_123!</span>
                                    </div>
                                </div>
                            </div>

                            <div class="data-item">
                                <div class="data-item-header">
                                    <span class="data-item-key">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                                        connection-string
                                    </span>
                                    <div class="data-item-actions">
                                        <button class="data-action-btn" onclick="toggleReveal(this)">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            显示
                                        </button>
                                        <button class="data-action-btn">
                                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                            复制
                                        </button>
                                    </div>
                                </div>
                                <div class="data-item-content">
                                    <div class="secret-value">
                                        <span class="secret-masked">••••••••••••••••••••••••••••••••••••</span>
                                        <span class="secret-revealed" style="display: none;">mysql://admin_user:super_secure_password_123!@mysql:3306/appdb</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 使用情况 Tab -->
                        <div id="tab-usage" class="tab-content">
                            <div class="info-section">
                                <div class="info-section-title">挂载此 Secret 的工作负载</div>
                                <div class="usage-list">
                                    <div class="usage-item">
                                        <div class="usage-icon">
                                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                                        </div>
                                        <div class="usage-info">
                                            <div class="usage-name" onclick="location.href='deployment-detail.html'">api-gateway</div>
                                            <div class="usage-type">Deployment - 环境变量</div>
                                        </div>
                                        <div class="usage-mount">envFrom</div>
                                    </div>
                                    <div class="usage-item">
                                        <div class="usage-icon">
                                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                                        </div>
                                        <div class="usage-info">
                                            <div class="usage-name" onclick="location.href='deployment-detail.html'">backend-service</div>
                                            <div class="usage-type">Deployment - 卷挂载</div>
                                        </div>
                                        <div class="usage-mount">/etc/secrets</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 元数据 Tab -->
                        <div id="tab-metadata" class="tab-content">
                            <div class="info-section">
                                <div class="info-section-title">标签</div>
                                <div class="selector-list">
                                    <span class="selector-tag">
                                        <span class="selector-key">app</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">database</span>
                                    </span>
                                    <span class="selector-tag">
                                        <span class="selector-key">type</span>
                                        <span class="selector-sep">=</span>
                                        <span class="selector-value">credentials</span>
                                    </span>
                                </div>
                            </div>
                            <div class="info-section">
                                <div class="info-section-title">其他信息</div>
                                <div class="info-grid">
                                    <div class="info-item">
                                        <span class="info-label">类型</span>
                                        <span class="info-value">Opaque</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">UID</span>
                                        <span class="info-value" style="font-family: monospace; font-size: 12px;">s3cr3t-1234-5678-90ab-cdef12345678</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">Resource Version</span>
                                        <span class="info-value" style="font-family: monospace;">54321098</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">创建时间</span>
                                        <span class="info-value">2024-01-05 11:20:45</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        `;

        function switchTab(tabName) {
            document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function toggleReveal(btn) {
            const content = btn.closest('.data-item').querySelector('.data-item-content');
            const masked = content.querySelector('.secret-masked');
            const revealed = content.querySelector('.secret-revealed');

            if (masked.style.display !== 'none') {
                masked.style.display = 'none';
                revealed.style.display = 'inline';
                btn.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg> 隐藏';
            } else {
                masked.style.display = 'inline';
                revealed.style.display = 'none';
                btn.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> 显示';
            }
        }
    </script>
</body>
</html>
