<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="base.css">
</head>
<body>
    <div class="ks-layout ks-layout-with-sidebar" id="app"></div>
    <script src="shared.js"></script>

                </div>

</html>
