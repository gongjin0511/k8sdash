<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - Deployment 详情</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
        .detail-title { display: flex; align-items: center; gap: 16px; }
        .detail-icon { width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg, var(--ks-primary), var(--ks-success)); display: flex; align-items: center; justify-content: center; color: #fff; }
        .detail-icon svg { width: 24px; height: 24px; }
        .detail-name { font-size: 20px; font-weight: 600; color: var(--text-primary); }
        .detail-namespace { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .detail-actions { display: flex; gap: 12px; }
        .detail-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .detail-tab { padding: 12px 20px; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .detail-tab:hover { color: var(--ks-primary); }
        .detail-tab.active { color: var(--ks-primary); border-bottom-color: var(--ks-primary); font-weight: 500; }
        .section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-size: 12px; color: var(--text-secondary); }
        .info-value { font-size: 14px; color: var(--text-primary); }
        .replica-panel { background: var(--content-bg); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
        .replica-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .replica-title { font-weight: 600; }
        .replica-controls { display: flex; align-items: center; gap: 12px; }
        .replica-btn { width: 32px; height: 32px; border: 1px solid var(--border-color); border-radius: 4px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .replica-btn:hover { border-color: var(--ks-primary); color: var(--ks-primary); }
        .replica-count { font-size: 18px; font-weight: 600; width: 60px; text-align: center; }
        .replica-visual { display: flex; gap: 8px; flex-wrap: wrap; }
        .pod-box { width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .pod-box.running { background: rgba(85, 188, 138, 0.2); border: 1px solid var(--ks-success); color: var(--ks-success); }
        .pod-box.pending { background: rgba(245, 166, 35, 0.2); border: 1px solid var(--ks-warning); color: var(--ks-warning); }
        .pod-list { margin-top: 24px; }
        .revision-list { margin-top: 16px; }
        .revision-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--content-bg); border-radius: 8px; margin-bottom: 12px; }
        .revision-info { display: flex; align-items: center; gap: 16px; }
        .revision-number { font-weight: 600; font-size: 16px; }
        .revision-meta { font-size: 13px; color: var(--text-secondary); }
        .revision-current { padding: 4px 8px; background: rgba(85, 188, 138, 0.1); color: var(--ks-success); border-radius: 4px; font-size: 12px; font-weight: 500; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .strategy-card { background: var(--content-bg); border-radius: 8px; padding: 20px; }
        .strategy-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .strategy-item:last-child { border-bottom: none; }
    </style>
</head>

        function switchTab(tabName) {
            document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));

</html>
