<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeSphere - 创建存储卷声明</title>
    <link rel="stylesheet" href="base.css">
    <style>
        /* 创建页面专用样式 */
        .create-page { max-width: 960px; margin: 0 auto; }

        /* 页面头部 */
        .create-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .create-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        /* 表单区块 */
        .form-section { margin-bottom: 32px; }
        .form-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .form-section-title .required { color: var(--ks-danger); margin-left: 2px; }

        /* 表单网格 */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full-width { grid-column: 1 / -1; }

        /* 表单标签和输入框 */
        .form-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .form-label .required { color: var(--ks-danger); margin-left: 2px; }
        .form-hint { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .form-input, .form-select {
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            color: var(--text-primary);
            background: #fff;
            transition: all 0.2s ease;
            outline: none;
        }
        .form-input:hover, .form-select:hover { border-color: #c4c9cc; }
        .form-input:focus, .form-select:focus {
            border-color: var(--ks-primary);
            box-shadow: 0 0 0 3px rgba(50, 157, 206, 0.12);
        }
        .form-input::placeholder { color: #b7c2cc; }
        .form-select {
            padding-right: 36px;
            cursor: pointer;
            appearance: none;
            background: #fff url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2379879c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e") right 10px center/16px no-repeat;
        }
        .form-select:hover {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23329dce' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
        }

        /* 表单操作 */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        /* 存储类卡片 */
        .storage-class-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .storage-class-card {
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }
        .storage-class-card:hover {
            border-color: var(--ks-primary);
            box-shadow: 0 2px 12px rgba(50, 157, 206, 0.1);
        }
        .storage-class-card.selected {
            border-color: var(--ks-primary);
            background: rgba(50, 157, 206, 0.03);
            box-shadow: 0 2px 12px rgba(50, 157, 206, 0.15);
        }
        .storage-class-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(50, 157, 206, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ks-primary);
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .storage-class-card.selected .storage-class-icon {
            background: var(--ks-primary);
            color: white;
            box-shadow: 0 2px 8px rgba(50, 157, 206, 0.35);
        }
        .storage-class-name { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
        .storage-class-provisioner {
            font-size: 11px;
            color: var(--text-secondary);
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            margin-bottom: 10px;
        }
        .storage-class-features { display: flex; flex-wrap: wrap; gap: 6px; }
        .storage-feature {
            font-size: 11px;
            padding: 3px 10px;
            background: #f4f5f7;
            border-radius: 4px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 访问模式 */
        .access-mode-options { display: flex; gap: 12px; }
        .access-mode-option {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }
        .access-mode-option:hover { border-color: var(--ks-primary); }
        .access-mode-option.selected {
            border-color: var(--ks-primary);
            background: rgba(50, 157, 206, 0.03);
            box-shadow: 0 0 0 3px rgba(50, 157, 206, 0.08);
        }
        .access-mode-option input { display: none; }
        .access-mode-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .access-mode-check {
            width: 18px;
            height: 18px;
            border: 2px solid #d8dee5;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .access-mode-option.selected .access-mode-check {
            background: var(--ks-primary);
            border-color: var(--ks-primary);
        }
        .access-mode-option.selected .access-mode-check svg { display: block; }
        .access-mode-check svg { display: none; width: 12px; height: 12px; stroke: white; }
        .access-mode-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
        .access-mode-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

        /* 容量输入 */
        .capacity-input-group { display: flex; gap: 8px; }
        .capacity-input {
            flex: 1;
            height: 36px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.2s ease;
            outline: none;
        }
        .capacity-input:focus {
            border-color: var(--ks-primary);
            box-shadow: 0 0 0 3px rgba(50, 157, 206, 0.12);
        }
        .capacity-unit {
            height: 36px;
            padding: 0 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #f9fbfd;
            font-size: 13px;
            min-width: 80px;
            cursor: pointer;
            appearance: none;
            background: #f9fbfd url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2379879c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e") right 10px center/16px no-repeat;
        }
        .capacity-slider { margin-top: 16px; }
        .slider-track {
            height: 6px;
            background: #e4e8eb;
            border-radius: 3px;
            position: relative;
            margin-bottom: 10px;
        }
        .slider-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--ks-primary);
            border-radius: 3px;
            width: 20%;
        }
        .slider-handle {
            position: absolute;
            top: 50%;
            left: 20%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: white;
            border: 2px solid var(--ks-primary);
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* 信息框 */
        .info-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(50, 157, 206, 0.08);
            border-radius: 6px;
            margin-top: 20px;
            border: 1px solid rgba(50, 157, 206, 0.15);
        }
        .info-box-icon { color: var(--ks-primary); flex-shrink: 0; }
        .info-box-content { font-size: 13px; color: var(--text-primary); line-height: 1.6; }

        /* 标签区域 */
        .label-section {
            padding: 16px;
            background: #f9fbfd;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .label-row {
            display: grid;
            grid-template-columns: 1fr 1fr 36px;
            gap: 12px;
            margin-bottom: 12px;
            align-items: end;
        }
        .remove-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .remove-btn:hover { background: rgba(202, 38, 33, 0.08); color: var(--ks-danger); }
        .add-label-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 2px dashed #d8dee5;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            color: var(--ks-primary);
            font-size: 12px;
            transition: all 0.2s;
        }
        .add-label-btn:hover { background: rgba(50, 157, 206, 0.03); border-color: var(--ks-primary); }
    </style>
</head>
<body>
    <div class="ks-layout ks-layout-with-sidebar" id="app"></div>
    <script src="shared.js"></script>
    <script>
        document.getElementById('app').innerHTML = `
            ${getSidebarHTML('storage')}
            <main class="ks-main ks-main-with-sidebar">
                ${getHeaderHTML([
                    {text: '工作台', href: 'index.html'},
                    {text: '存储管理', href: 'storage.html'},
                    {text: '存储卷声明', href: 'storage.html'},
                    {text: '创建存储卷声明'}
                ])}
                <div class="ks-content">
                    <div class="ks-card create-page">
                        <div class="create-header">
                            <h1>创建存储卷声明 (PersistentVolumeClaim)</h1>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">基本信息</div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label">名称 <span class="required">*</span></label>
                                    <input type="text" class="form-input" placeholder="请输入 PVC 名称">
                                    <span class="form-hint">只能包含小写字母、数字和连字符</span>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">命名空间 <span class="required">*</span></label>
                                    <select class="form-select">
                                        <option value="">选择命名空间</option>
                                        <option value="default">default</option>
                                        <option value="production" selected>production</option>
                                        <option value="staging">staging</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label class="form-label">描述</label>
                                    <input type="text" class="form-input" placeholder="添加描述（可选）">
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">存储类</div>
                            <div class="storage-class-cards">
                                <div class="storage-class-card selected" onclick="selectStorageClass(this)">
                                    <div class="storage-class-icon">
                                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                            <ellipse cx="12" cy="5" rx="9" ry="3"/>
                                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                                        </svg>
                                    </div>
                                    <div class="storage-class-name">standard</div>
                                    <div class="storage-class-provisioner">kubernetes.io/gce-pd</div>
                                    <div class="storage-class-features">
                                        <span class="storage-feature">默认</span>
                                        <span class="storage-feature">动态供应</span>
                                    </div>
                                </div>
                                <div class="storage-class-card" onclick="selectStorageClass(this)">
                                    <div class="storage-class-icon">
                                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                            <ellipse cx="12" cy="5" rx="9" ry="3"/>
                                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                                        </svg>
                                    </div>
                                    <div class="storage-class-name">fast-ssd</div>
                                    <div class="storage-class-provisioner">kubernetes.io/gce-pd</div>
                                    <div class="storage-class-features">
                                        <span class="storage-feature">SSD</span>
                                        <span class="storage-feature">高性能</span>
                                    </div>
                                </div>
                                <div class="storage-class-card" onclick="selectStorageClass(this)">
                                    <div class="storage-class-icon">
                                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                            <ellipse cx="12" cy="5" rx="9" ry="3"/>
                                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                                        </svg>
                                    </div>
                                    <div class="storage-class-name">nfs-storage</div>
                                    <div class="storage-class-provisioner">nfs-provisioner</div>
                                    <div class="storage-class-features">
                                        <span class="storage-feature">NFS</span>
                                        <span class="storage-feature">共享存储</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">访问模式 <span class="required">*</span></div>
                            <div class="access-mode-options">
                                <label class="access-mode-option selected" onclick="selectAccessMode(this)">
                                    <input type="checkbox" checked>
                                    <div class="access-mode-header">
                                        <div class="access-mode-check">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                        </div>
                                        <span class="access-mode-name">ReadWriteOnce (RWO)</span>
                                    </div>
                                    <div class="access-mode-desc">卷可以被单个节点以读写方式挂载</div>
                                </label>
                                <label class="access-mode-option" onclick="selectAccessMode(this)">
                                    <input type="checkbox">
                                    <div class="access-mode-header">
                                        <div class="access-mode-check">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                        </div>
                                        <span class="access-mode-name">ReadOnlyMany (ROX)</span>
                                    </div>
                                    <div class="access-mode-desc">卷可以被多个节点以只读方式挂载</div>
                                </label>
                                <label class="access-mode-option" onclick="selectAccessMode(this)">
                                    <input type="checkbox">
                                    <div class="access-mode-header">
                                        <div class="access-mode-check">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                        </div>
                                        <span class="access-mode-name">ReadWriteMany (RWX)</span>
                                    </div>
                                    <div class="access-mode-desc">卷可以被多个节点以读写方式挂载</div>
                                </label>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">存储容量 <span class="required">*</span></div>
                            <div class="form-group" style="max-width: 400px;">
                                <div class="capacity-input-group">
                                    <input type="number" class="capacity-input" value="10" min="1">
                                    <select class="capacity-unit">
                                        <option value="Gi" selected>GiB</option>
                                        <option value="Mi">MiB</option>
                                        <option value="Ti">TiB</option>
                                    </select>
                                </div>
                                <div class="capacity-slider">
                                    <div class="slider-track">
                                        <div class="slider-fill"></div>
                                        <div class="slider-handle"></div>
                                    </div>
                                    <div class="slider-labels">
                                        <span>1 GiB</span>
                                        <span>50 GiB</span>
                                        <span>100 GiB</span>
                                    </div>
                                </div>
                            </div>
                            <div class="info-box">
                                <div class="info-box-icon">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                </div>
                                <div class="info-box-content">
                                    存储容量一旦创建后通常无法减小。部分存储类支持在线扩容，请确保选择适当的初始容量。
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <div class="form-section-title">标签</div>
                            <div class="label-section">
                                <div class="label-row">
                                    <div class="form-group">
                                        <label class="form-label">键</label>
                                        <input type="text" class="form-input" placeholder="key" value="app">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">值</label>
                                        <input type="text" class="form-input" placeholder="value" value="database">
                                    </div>
                                    <button class="remove-btn" title="删除">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                    </button>
                                </div>
                                <button class="add-label-btn">
                                    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                    添加标签
                                </button>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button class="ks-btn ks-btn-default" onclick="location.href='storage.html'">取消</button>
                            <button class="ks-btn ks-btn-default" onclick="location.href='yaml-editor.html'">编辑 YAML</button>
                            <button class="ks-btn ks-btn-primary">创建</button>
                        </div>
                    </div>
                </div>
            </main>
        `;

        function selectStorageClass(card) {
            document.querySelectorAll('.storage-class-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
        }

        function selectAccessMode(option) {
            option.classList.toggle('selected');
            option.querySelector('input').checked = option.classList.contains('selected');
        }
    </script>
</body>
</html>
